name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1, reads rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --bins
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  # ── CI Summary ──────────────────────────────────────
  # Aggregate gate: the single required status check on main. Requiring this
  # rather than each job by name means adding or renaming a job never needs a
  # matching ruleset edit — only the `needs` list below.
  #
  # Unlike the backend's equivalent, `skipped` is treated as a failure here.
  # Nothing in this workflow is path-filtered or conditionally gated, so a
  # skipped job means a condition regressed rather than that work was
  # legitimately avoided — which is precisely how a green summary once hid a
  # pipeline that ran no tests at all.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-test
      - deny
      - docker
      - terraform
    steps:
      - name: Check all jobs
        run: |
          declare -A results=(
            [lint-test]="${{ needs.lint-test.result }}"
            [deny]="${{ needs.deny.result }}"
            [docker]="${{ needs.docker.result }}"
            [terraform]="${{ needs.terraform.result }}"
          )

          echo "CI pipeline status:"
          fail=0
          for job in "${!results[@]}"; do
            printf "  %-12s %s\n" "$job" "${results[$job]}"
            if [ "${results[$job]}" != "success" ]; then
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo
            echo "At least one job did not succeed."
            exit 1
          fi
          echo
          echo "All jobs succeeded."
