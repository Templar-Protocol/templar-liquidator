[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "CC0-1.0", "GPL-3.0-only", "MPL-2.0", "BSL-1.0",
    # MIT minus the attribution requirement — strictly more permissive than
    # the MIT already allowed. Entered the tree via borrow-or-share
    # (jsonschema stack, pulled by templar-gateway-methods-dispatch).
    "MIT-0",
]

# `redstone` (git dep of near-sdk's oracle stack) carries no `license` /
# `license-file` field in its own Cargo.toml — the real license (Boost
# Software License 1.0) lives in a LICENSE file at the git repo's workspace
# root, one level above the package directory cargo-deny scans. Manually
# asserted here rather than silently allowed; verified by hand against
# https://github.com/redstone-finance/rust-sdk/blob/3.1.0-pre1/LICENSE.
[[licenses.clarify]]
crate = "redstone"
expression = "BSL-1.0"
license-files = []

[advisories]
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0258 (h2 0.3.27, "unbounded empty DATA frames") and
    # RUSTSEC-2025-0134 (rustls-pemfile 1.0.4, unmaintained) were both ignored
    # here because they arrived through our direct reqwest 0.11.27 -> hyper
    # 0.14. Bumping that dependency to reqwest 0.13 was the fix both entries
    # named: h2 0.3.x and rustls-pemfile are gone from Cargo.lock entirely, so
    # the ignores are removed rather than left to rot as `advisory-not-detected`
    # warnings. Nothing to re-add if a future bump reintroduces them — they
    # would be new findings on their own merits.

    # RUSTSEC-2026-0222 — wasmtime 45.0.3, "Stores can mix up type indices
    # between engines". Path: near-sdk 5.29.0 (feature `unit-testing`) ->
    # near-vm-runner -> wasmtime. `unit-testing` is enabled ONLY by our
    # dev-dependencies templar-gateway-testing / test-utils (pinned
    # Templar-Protocol/contracts rev), which use it as a mock-contract WASM
    # test harness — none of the crate's own [dependencies] or the regular
    # (non-dev) templar-* deps request it. Verified with
    # `cargo tree -e normal -i wasmtime` and `cargo tree -e no-dev -i
    # wasmtime`: both resolve to nothing, so wasmtime is entirely absent
    # from `cargo build --release --bin liquidator` — it never ships, and
    # our own source never touches near-vm-runner/wasmtime APIs. Clears
    # when near-sdk ships a patched wasmtime, or the templar-* pin moves to
    # a contracts rev whose test harness is off the vulnerable range.
    { id = "RUSTSEC-2026-0222", reason = "wasmtime is reachable only through near-sdk's unit-testing feature, activated solely by our dev-dependencies (templar-gateway-testing / test-utils); confirmed absent from the release binary via `cargo tree -e normal -i wasmtime` (empty). Clears when near-sdk ships a patched wasmtime." },

    # RUSTSEC-2026-0269 — wasmtime 45.0.3, "Filesystem sandbox escape when
    # paths or symlinks contain trailing slashes". Same crate and same path as
    # RUSTSEC-2026-0222 above: near-sdk 5.29.0 (feature `unit-testing`) ->
    # near-vm-runner -> wasmtime, and that feature is requested only by the
    # dev-dependencies templar-gateway-testing / test-utils. Re-verified on
    # this advisory rather than assumed: `cargo tree -e normal -i wasmtime`
    # prints nothing, so no wasmtime code reaches the release binary — and the
    # bot never loads untrusted WASM in any case. The wasmtime version is
    # fixed by the pinned contracts rev (see THE SINGLE-REV RULE), so the
    # upgrade is not ours to make; this clears when near-sdk ships a patched
    # wasmtime and we bump that rev.
    { id = "RUSTSEC-2026-0269", reason = "wasmtime is reachable only through near-sdk's unit-testing feature, activated solely by our dev-dependencies (templar-gateway-testing / test-utils); confirmed absent from the release binary via `cargo tree -e normal -i wasmtime` (empty). Clears when near-sdk ships a patched wasmtime." },

    # RUSTSEC-2024-0436 — `paste` 1.0.15, unmaintained (not a vulnerability;
    # repo archived, no safe upgrade). Path: alloy (via
    # templar-universal-account -> alloy-signer-local -> alloy) ->
    # alloy-primitives -> paste. `cargo tree -e normal -i paste` confirms it
    # resolves as `(proc-macro)`: it runs only during macro expansion at
    # compile time and contributes no code to the compiled binary. Clears
    # when alloy drops its `paste` dependency upstream.
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc-macro (compile-time only, no runtime code in the shipped binary), pulled in transitively via alloy -> templar-universal-account. Unmaintained, not a vulnerability; no safe upgrade exists. Clears when alloy drops it." },

    # wasmtime 45.0.3 — six more advisories on the same crate and the same
    # dev-only path as RUSTSEC-2026-0222 / -0269 above (near-sdk feature
    # `unit-testing` -> near-vm-runner -> wasmtime, requested only by the
    # dev-dependencies templar-gateway-testing / test-utils). Re-verified
    # rather than assumed: `cargo tree -e normal --target all -i wasmtime`
    # prints nothing. No 45.x release carries the fixes (they landed in
    # 36.0.x, 48.x and 49.x), and every near-vm-runner through 0.38.0-rc.6
    # requires `wasmtime ^45`, so no lockfile move reaches a patched version.
    # Clears with the same contracts-rev bump as the two above.
    { id = "RUSTSEC-2026-0316", reason = "wasmtime: dev-only (near-sdk unit-testing via templar-gateway-testing / test-utils), absent from the release binary on every target; no patched 45.x exists and near-vm-runner requires ^45." },
    { id = "RUSTSEC-2026-0327", reason = "wasmtime: dev-only (near-sdk unit-testing via templar-gateway-testing / test-utils), absent from the release binary on every target; no patched 45.x exists and near-vm-runner requires ^45." },
    { id = "RUSTSEC-2026-0359", reason = "wasmtime: dev-only (near-sdk unit-testing via templar-gateway-testing / test-utils), absent from the release binary on every target; no patched 45.x exists and near-vm-runner requires ^45." },
    { id = "RUSTSEC-2026-0362", reason = "wasmtime: dev-only (near-sdk unit-testing via templar-gateway-testing / test-utils), absent from the release binary on every target; no patched 45.x exists and near-vm-runner requires ^45." },
    { id = "RUSTSEC-2026-0363", reason = "wasmtime: dev-only (near-sdk unit-testing via templar-gateway-testing / test-utils), absent from the release binary on every target; no patched 45.x exists and near-vm-runner requires ^45." },
    { id = "RUSTSEC-2026-0379", reason = "wasmtime: dev-only (near-sdk unit-testing via templar-gateway-testing / test-utils), absent from the release binary on every target; no patched 45.x exists and near-vm-runner requires ^45." },

    # rustls 0.23.43 and rustls-webpki 0.103.13. The release binary has no
    # rustls on any target — `cargo tree -e normal --target all -i rustls`
    # prints nothing; every shipped TLS client is native-tls (OpenSSL on
    # Linux). The one path in is the dev-dependency templar-gateway-testing
    # -> near-sandbox -> ureq, which downloads the `neard` sandbox binary
    # over TLS at test time. The fixes cannot resolve: rustls >=0.23.45 and
    # rustls-webpki >=0.103.14 need `aws-lc-rs ^1.18`, and near-crypto pins
    # `aws-lc-rs =1.16.2` in every release through 0.38.0-rc.5 (rc.6 is the
    # first to relax it). Clears when a stable near-crypto with the relaxed
    # pin lands and the templar-* rev moves onto it.
    { id = "RUSTSEC-2026-0285", reason = "rustls: dev-only (near-sandbox's test-time neard download via ureq), absent from the release binary on every target; >=0.23.45 needs aws-lc-rs ^1.18, blocked by near-crypto's =1.16.2 pin." },
    { id = "RUSTSEC-2026-0346", reason = "rustls: dev-only (near-sandbox's test-time neard download via ureq), absent from the release binary on every target; >=0.23.46 needs aws-lc-rs ^1.18, blocked by near-crypto's =1.16.2 pin." },
    { id = "RUSTSEC-2026-0348", reason = "rustls: dev-only (near-sandbox's test-time neard download via ureq), absent from the release binary on every target; >=0.23.46 needs aws-lc-rs ^1.18, blocked by near-crypto's =1.16.2 pin." },
    { id = "RUSTSEC-2026-0349", reason = "rustls: dev-only (near-sandbox's test-time neard download via ureq), absent from the release binary on every target; >=0.23.46 needs aws-lc-rs ^1.18, blocked by near-crypto's =1.16.2 pin." },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki: dev-only (rustls via near-sandbox's test-time neard download), absent from the release binary on every target; >=0.103.16 needs aws-lc-rs ^1.18, blocked by near-crypto's =1.16.2 pin." },

    # RUSTSEC-2024-0449 — unsafe-libyaml 0.2.11, unmaintained (not a
    # vulnerability; no safe upgrade). This one does ship: near-jsonrpc-client
    # (via templar-common) -> near-chain-configs -> near-parameters ->
    # serde_yaml 0.9.34+deprecated -> unsafe-libyaml. near-parameters uses
    # it to parse nearcore's bundled runtime-config YAML, which is compiled
    # into the crate — the bot never feeds it external YAML. Clears when
    # nearcore moves off serde_yaml.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained, not a vulnerability; reached via near-parameters' serde_yaml, which parses only nearcore's compiled-in runtime config, never external input. No safe upgrade exists. Clears when nearcore drops serde_yaml." },
]

[bans]
multiple-versions = "allow"

[sources]
# Fail closed on any git dependency not explicitly listed below, so a new
# transitive git source can't slip in unreviewed. The three URLs are every
# git source currently in Cargo.lock (verified via
# `rg 'source = "git\+' Cargo.lock` / `cargo tree -e no-dev -i <crate>`);
# add a new one here deliberately when a dependency change legitimately
# introduces another.
unknown-git = "deny"
allow-git = [
    "https://github.com/Templar-Protocol/contracts",
    "https://github.com/Templar-Protocol/pyth-lazer-public",
    "https://github.com/redstone-finance/rust-sdk",
]
