name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Fail the release BEFORE anything is published. Every check in the script
  # guards a failure that is silent rather than loud — a mislabelled image, a
  # stale lock that only breaks inside the Docker build, a release with no
  # changelog entry. Cheap, and it runs first because `image` needs it.
  # Runnable locally: ./scripts/check-release.sh vX.Y.Z
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-release.sh "${GITHUB_REF_NAME}"

  image:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/templar-protocol/templar-liquidator
          # `latest=auto` only moves :latest for a non-prerelease semver tag —
          # the previous `type=raw,value=latest` moved it unconditionally, so
          # tagging v1.0.0-rc.1 would have repointed :latest, and README's
          # quickstart, at a release candidate. The {{major}}.{{minor}} tag is
          # guarded for the same reason: metadata-action does not exclude
          # prereleases from it on its own.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
