name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1, reads rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --bins
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false

  # Cross-file pins that no compiler or linter can catch on its own: THE
  # SINGLE-REV RULE and the three-way Rust version pin. Both fail in ways that
  # do not name themselves (see the script's header), so they get their own
  # gate. Runnable locally: ./scripts/check-repo-invariants.sh
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-repo-invariants.sh

  # The repo ships operator-facing shell — deploy.sh, init-server.sh, the
  # run-*.sh wrappers, the Loki/Grafana installer — that people are told to
  # read and run against their own servers, plus the dev container's
  # post-create. Nothing was linting any of it.
  #
  # Gated at `error` rather than shellcheck's default, deliberately. At
  # `warning` the existing scripts produce 6 findings and at `info` 34, and
  # the loudest of them are intentional: deploy.sh's unquoted `<< EOF`
  # heredocs (SC2087) interpolate local variables into the script that runs on
  # the remote host, which is the whole point of those blocks. Turning this on
  # at `error` gates real bugs from day one instead of landing red and being
  # ignored. Tighten it by fixing the warnings first, then raising the level.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --severity=error scripts/*.sh .devcontainer/*.sh

  # ── CI Summary ──────────────────────────────────────
  # Aggregate gate: the single required status check on main. Requiring this
  # rather than each job by name means adding or renaming a job never needs a
  # matching ruleset edit — only the `needs` list below.
  #
  # `skipped` is treated as a failure here, not a pass.
  # Nothing in this workflow is path-filtered or conditionally gated, so a
  # skipped job means a condition regressed rather than that work was
  # legitimately avoided — which is precisely how a green summary once hid a
  # pipeline that ran no tests at all.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-test
      - deny
      - docker
      - invariants
      - shellcheck
    steps:
      - name: Check all jobs
        run: |
          declare -A results=(
            [lint-test]="${{ needs.lint-test.result }}"
            [deny]="${{ needs.deny.result }}"
            [docker]="${{ needs.docker.result }}"
            [invariants]="${{ needs.invariants.result }}"
            [shellcheck]="${{ needs.shellcheck.result }}"
          )

          echo "CI pipeline status:"
          fail=0
          for job in "${!results[@]}"; do
            printf "  %-12s %s\n" "$job" "${results[$job]}"
            if [ "${results[$job]}" != "success" ]; then
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo
            echo "At least one job did not succeed."
            exit 1
          fi
          echo
          echo "All jobs succeeded."
