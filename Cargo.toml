[package]
name = "templar-liquidator"
version = "1.0.0"
edition = "2021"
rust-version = "1.97.0"
license = "GPL-3.0-only"
repository = "https://github.com/Templar-Protocol/templar-liquidator"
description = "Inventory-based liquidation bot for Templar Protocol lending markets on NEAR"

# Standalone crate: an empty workspace table stops Cargo from adopting any
# enclosing workspace, wherever this repo happens to be checked out.
[workspace]

[lib]
path = "src/liquidator.rs"

[[bin]]
name = "liquidator"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
futures = "0.3.31"
hex = { version = "0.4.3", features = ["serde"] }
# secp256k1 recovery + keccak: the RedStone push leg recovers each gateway
# package's signer locally before spending gas on a payload. Both already
# sit in the dependency tree via the NEAR stack.
k256 = "0.13"
near-account-id = "2.6"
near-api = "0.8.6"
near-crypto = "0.37.3"
near-jsonrpc-client = "0.22.0"
near-sdk = { version = "5.25", default-features = false, features = ["unstable", "non-contract-usage"] }
# Feature set pinned rather than inherited, because 0.13 changed both halves
# of what 0.11 gave us by default:
#
# - `default-tls` was redefined from native-tls to rustls. Taking that default
#   links a *second* TLS stack (rustls + rustls-platform-verifier +
#   webpki-root-certs) into a binary that already links OpenSSL for the NEAR
#   RPC path — near-api's reqwest 0.12 pulls native-tls in regardless, so
#   rustls here would be additive, not a replacement. Naming `native-tls`
#   keeps the three HTTP integrations below on the same backend they have
#   always used, and the same one near-api uses.
# - `query` and `form` became opt-in. Only `query` is used, by the Hermes
#   price fetch in src/oracle.rs; omitting it is a compile error.
#
# `charset`, `http2` and `system-proxy` were unconditional in 0.11 and are
# spelled out only because `default-features = false` also turns them off.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
] }
serde = { version = "1.0", features = ["derive"] }
sha3 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5"

# ── Templar crates: ONE uniform rev for every crate (mixed revs make Cargo
# resolve two contracts checkouts whose types don't unify). Bump ALL revs
# together, never one alone.
templar-common = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0", features = ["rpc"] }
templar-gateway-client = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0", features = ["clap"] }
templar-gateway-core = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0" }
templar-gateway-methods-spec = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0" }
templar-gateway-oracle-updates-dispatch = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0" }
templar-gateway-oracle-updates-spec = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0" }
templar-gateway-types = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0" }
templar-proxy-oracle-near-common = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0" }

[dev-dependencies]
anyhow = "1.0.102"
templar-gateway-testing = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0" }
test-utils = { git = "https://github.com/Templar-Protocol/contracts", rev = "8f8fe1d1a057756f71438abc75d7b3c688b282f0" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
large_futures = "allow"
redundant_closure_for_method_calls = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "warn"
large_digit_groups = "warn"
wildcard_imports = "allow"
doc_markdown = "allow"
result_large_err = "allow"
ignore_without_reason = "allow"
# clippy::pedantic lint added after this codebase's pedantic-warn baseline was
# set upstream; fires on lifted code (incl. src/swap/oneclick.rs sleep
# intervals); allowed to keep the lifted source unmodified — purely stylistic.
duration_suboptimal_units = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
debug = false
panic = "abort"
strip = "symbols"
overflow-checks = true
